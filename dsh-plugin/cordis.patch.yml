- insert:
    - id: civi6-kb
      name: "@local/civi6-kb"
      config:
        # 默认数据源：vanilla（原版）或 bbg（BBG）。
        # 每个工具也可传 source: "vanilla" | "bbg" 临时切换。
        dataSource: bbg
        # 相对路径以插件目录（dsh-plugin/）为基准解析，因此换机器、换工作目录都不用改。
        # 绝对值也可以直接写，例如 D:\Code\AgenticCIV6\data\civi6.sqlite
        dbPaths:
          vanilla: ../data/civi6.sqlite
          bbg: ../data/civi6-bbg.sqlite
